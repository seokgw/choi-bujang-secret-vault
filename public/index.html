<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; white-space: pre-wrap; }
    [hidden] { display: none !important; }
    label { display: block; margin: 12px 0; }
    input, textarea { box-sizing: border-box; width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #51667c; border-radius: 8px; background: #1a2a3d; color: #ecf4ff; font: inherit; }
    button { padding: 10px 15px; margin: 8px 8px 0 0; border: 1px solid #8ad8df; border-radius: 8px; background: #203f50; color: #ecf4ff; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 4단계 내 자료 보호</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다. 로그인 후 자료를 조회하고 편집할 수 있습니다.</p>
    <div class="notice">로그인한 계정의 메모만 조회하고 편집할 수 있습니다.</div>
    <p id="status" role="status" aria-live="polite"></p>
    <form id="login">
      <label>이메일<input name="email" type="email" autocomplete="username" required maxlength="320"></label>
      <label>비밀번호<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
      <button type="submit">로그인</button>
    </form>
    <section id="workspace" hidden>
      <button id="logout" type="button">로그아웃</button>
      <form id="editor">
        <h2 id="editor-heading">메모 추가</h2>
        <label>제목<input name="title" required maxlength="200"></label>
        <label>본문<textarea name="content" rows="4" required maxlength="10000"></textarea></label>
        <button type="submit">저장</button><button id="cancel" type="button">새 메모 작성</button>
      </form>
      <ul id="notes" aria-live="polite"></ul>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
