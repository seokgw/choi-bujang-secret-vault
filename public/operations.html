<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYTE BACK · 탈환 작전실</title>
<style>body{background:#101a28;color:#edf4ff;font:16px system-ui;margin:0}main{max-width:760px;margin:auto;padding:30px 20px}section{border:1px solid #586b7a;border-radius:12px;margin:12px 0;padding:16px}small{color:#b4c8d6}button{background:#173c4e;color:white;border:1px solid #8ad8df;border-radius:8px;padding:12px}a{color:#8ad8df}</style>
</head><body><main><a href="/">자료실로 돌아가기</a><h1>탈환 작전실</h1><p>서버 응답에 근거한 값만 표시합니다. 코드 규칙 수는 공격 방어 통과 수가 아닙니다.</p><button id="refresh">서버 기록 다시 확인</button><p id="state" role="status">조회 전 · 미실행</p><div id="summary"></div></main>
<script type="module">
const state=document.getElementById('state'), root=document.getElementById('summary');
function row(title,value,detail){const section=document.createElement('section');const heading=document.createElement('h2');heading.textContent=title;const p=document.createElement('p');p.textContent=value;const small=document.createElement('small');small.textContent=detail;section.append(heading,p,small);root.append(section);}
const TEST_LABELS=Object.freeze({
  static_note_removal:'공개 메모 파일 제거 확인',
  anonymous_note_rejection:'비로그인 메모 접근 차단',
  deployment_identity:'배포 식별 정보 확인',
  registered_device_live:'등록 기기 정상 접근',
  verified_single_note_restore_live:'단건 메모 복구 검증'
});
function evidenceTable(records){
  const section=document.createElement('section');
  const title=document.createElement('h2');title.textContent='실제 API 요청 검증표';
  const caption=document.createElement('p');caption.textContent='서버 API에서 보고한 HTTP 응답과 미실행을 구분합니다. 요청 ID는 동일 Vercel 로그와 검증된 ID가 아닐 수 있습니다.';
  const table=document.createElement('table');
  table.style.cssText='width:100%;border-collapse:collapse;font-size:13px;overflow-wrap:anywhere';
  const head=document.createElement('thead'),tr=document.createElement('tr');
  for(const text of ['검증 항목','기대 HTTP','실제 HTTP','요청 ID','확인 시각','검증 상태']){
    const th=document.createElement('th');th.textContent=text;th.style.cssText='padding:8px 4px;border-bottom:1px solid #586b7a;text-align:left';tr.append(th);
  }
  head.append(tr);table.append(head);
  const body=document.createElement('tbody');
  for(const record of records){
    const r=document.createElement('tr');
    const status=record.status==='api_observed'?'서버 대조 완료':record.status==='http_unverified'?'HTTP 관측 · 로그 미대조':'미실행';
    const values=[TEST_LABELS[record.attackId]??record.attackId,
      Array.isArray(record.expected)?record.expected.join(' 또는 '):'—',
      Number.isInteger(record.httpStatus)?String(record.httpStatus):'미실행',
      record.requestId??'—',record.checkedAt??'—',status];
    for(const value of values){const td=document.createElement('td');td.textContent=value;td.style.cssText='padding:8px 4px;border-bottom:1px solid #334557;vertical-align:top';r.append(td);}
    body.append(r);
  }
  table.append(body);const wrap=document.createElement('div');wrap.style.overflowX='auto';wrap.append(table);
  section.append(title,caption,wrap);root.append(section);
}
async function refresh(){root.replaceChildren();state.textContent='서버 확인 중';try{const res=await fetch('/api/operations',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!res.ok){state.textContent=res.status===401?'로그인 필요 · 기록 확인 불가':'서버 기록 확인 불가 · 미실행';return;}const d=await res.json();if(d.schema!=='aleph.operations.summary.v1')throw Error('invalid response');state.textContent='서버 응답 확인 · 운영 시험 통과 여부와 별개';const http=d.http;
if(http && Array.isArray(http.records)){
  const records=http.records;
  const actual=records.filter(x=>x.status==='api_observed'&&Number.isInteger(x.httpStatus));
  row('서버 기록과 대조 완료',String(actual.length)+'/'+String(records.length)+'건',
    '이 응답의 가린 요청 기록과 동일한 행에서 계산 · 심판 로그 대조는 별도');
  evidenceTable(records);
}
row('판정 규칙',d.policy.status==='code_inventory'?'코드 목록 · 실측 미확인':'미확인',d.policy.status==='code_inventory'?d.policy.rules.join(', '):'기준 기록 없음');row('탐지 사건',d.detection.status==='api_verified'?String(d.detection.count)+'건':'미실행','실제 서버 사건 기록');row('기기 회수',d.revocation.status==='api_verified'?String(d.revocation.count)+'건':'미실행','실제 서버 회수 기록');row('복구 버전',d.recovery.status==='api_verified'&&d.recovery.version?d.recovery.version:'미실행','검증된 서버 복원 기록');row('기기 승인',d.device.status==='api_verified'?(d.device.approved?'서버 승인 확인':'서버 미승인 확인'):'미실행','이번 요청 서버 검증');row('41종 총공세',d.assault.status==='api_verified'&&Number.isInteger(d.assault.defended)?String(d.assault.defended)+'/41':'미실행','실제 API 검증 없이 통과 처리하지 않음');}catch{state.textContent='서버 기록 확인 불가 · 미실행';}}
document.getElementById('refresh').addEventListener('click',refresh);refresh();
</script></body></html>
