<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYTE BACK · 탈환 작전실</title>
<style>body{background:#101a28;color:#edf4ff;font:16px system-ui;margin:0}main{max-width:760px;margin:auto;padding:30px 20px}section{border:1px solid #586b7a;border-radius:12px;margin:12px 0;padding:16px}small{color:#b4c8d6}button{background:#173c4e;color:white;border:1px solid #8ad8df;border-radius:8px;padding:12px}a{color:#8ad8df}</style>
</head><body><main><a href="/">자료실로 돌아가기</a><h1>탈환 작전실</h1><p>서버 응답에 근거한 값만 표시합니다. 코드 규칙 수는 공격 방어 통과 수가 아닙니다.</p><button id="refresh">서버 기록 다시 확인</button><p id="state" role="status">조회 전 · 미실행</p><div id="summary"></div></main>
<script type="module">
const state=document.getElementById('state'), root=document.getElementById('summary');
function row(title,value,detail){const section=document.createElement('section');const heading=document.createElement('h2');heading.textContent=title;const p=document.createElement('p');p.textContent=value;const small=document.createElement('small');small.textContent=detail;section.append(heading,p,small);root.append(section);}
async function refresh(){root.replaceChildren();state.textContent='서버 확인 중';try{const res=await fetch('/api/operations',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!res.ok){state.textContent=res.status===401?'로그인 필요 · 기록 확인 불가':'서버 기록 확인 불가 · 미실행';return;}const d=await res.json();if(d.schema!=='aleph.operations.summary.v1')throw Error('invalid response');state.textContent='서버 응답 확인 · 운영 시험 통과 여부와 별개';row('판정 규칙',d.policy.status==='code_inventory'?String(d.policy.count)+'개 (코드 목록)':'미확인',d.policy.status==='code_inventory'?d.policy.rules.join(', '):'기준 기록 없음');row('탐지 사건',d.detection.status==='api_verified'?String(d.detection.count)+'건':'미실행','실제 서버 사건 기록');row('기기 회수',d.revocation.status==='api_verified'?String(d.revocation.count)+'건':'미실행','실제 서버 회수 기록');row('복구 버전',d.recovery.status==='api_verified'&&d.recovery.version?d.recovery.version:'미실행','검증된 서버 복원 기록');row('기기 승인',d.device.status==='api_verified'?(d.device.approved?'서버 승인 확인':'서버 미승인 확인'):'미실행','이번 요청 서버 검증');row('41종 총공세',d.assault.status==='api_verified'&&Number.isInteger(d.assault.defended)?String(d.assault.defended)+'/41':'미실행','실제 API 검증 없이 통과 처리하지 않음');}catch{state.textContent='서버 기록 확인 불가 · 미실행';}}
document.getElementById('refresh').addEventListener('click',refresh);refresh();
</script></body></html>
